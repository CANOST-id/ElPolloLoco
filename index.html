<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style/nav-button-style.css">

    <script src="models/game-elements/sounds.class.js"></script>
    <script src="models/game-mechanic/drawing-manager.class.js"></script>
    <script src="models/class-images/character-images.class.js"></script>
    <script src="models/class-images/endboss-images.class.js"></script>
    <script src="models/game-elements/endscreen.class.js"></script>
    <script src="models/game-elements/drawable-object.class.js"></script>
    <script src="models/game-elements/canvas-buttons.class.js"></script>
    <script src="models/game-elements/status-bar.class.js"></script>

</head>

<body onload="startOverlay()">

    <header>
        <h1>El Pollo Loco</h1>
    </header>

    <canvas width="720" height="480" id="canvas"></canvas>

    <section class="rotate-device">
        <img class="rotate-device-image" src="./assets/img_pollo_locco/img/rotate-device.png" alt="">
    </section>

    <section class="touch-buttons">
        <section class="touch-left-side">
            <button id="btn-left" class="touch-btn">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="30" cy="30" r="28" fill="transparent" stroke="#fff" stroke-width="2" />
                    <path d="M35 20 L25 30 L35 40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>

            <button id="btn-right" class="touch-btn">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="30" cy="30" r="28" fill="transparent" stroke="#fff" stroke-width="2" />
                    <path d="M25 20 L35 30 L25 40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
        </section>

        <section class="touch-right-side">
            <button id="btn-jump" class="touch-btn">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="30" cy="30" r="28" fill="transparent" stroke="#fff" stroke-width="2" />
                    <path d="M20 35 L30 25 L40 35" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>

            <button id="btn-throw" class="touch-btn">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="30" cy="30" r="28" fill="transparent" stroke="#fff" stroke-width="2" />
                    <path d="M22 35 Q30 20 38 35" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
                    <circle cx="38" cy="35" r="2" fill="#fff" />
                    <path d="M20 37 L24 33 L28 37" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
        </section>

    </section>

    <dialog id="dialog" onclick="closeDialog()"></dialog>


    <footer>
        <a href="legal_notice.html">Legal Notice</a>
    </footer>

</body>

</html>
